name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The exact NLTK data unstructured needs to partition markdown/text, fetched ONCE in a
    # named step below and pinned here so the test phase never reaches nltk.org. This job runs
    # on the BARE runner (no Docker image, so no baked NLTK_DATA), and `.md` -> UnstructuredMarkdownLoader
    # -> unstructured.nlp.tokenize imports at test time. On unstructured==0.18.32 that module's
    # download_nltk_packages() runs at import and, if the resources are absent, calls
    # nltk.download(...) against nltk.org -- which made test_embed_markdown_reports_complete FAIL
    # on run 35789487009 attempt 1 and PASS on attempt 2 with no code change: a green that
    # depended on a third-party server being reachable. Prefetching + AUTO_DOWNLOAD_NLTK=false
    # (in the test env) removes that dependency from the test phase.
    env:
      NLTK_DATA: ${{ github.workspace }}/.nltk_data

    # A real, disposable Postgres for the tests that exercise the per-file write lock
    # (tests/utils/test_simultaneous_write.py) and the entitlement query path against a
    # real vector store (tests/utils/test_empty_entitlement_query_path.py). Without it
    # those tests SKIP -- which is what the lock tests did when #55 landed: proven only on
    # a developer's isolated container. RAG_TEST_PG_REQUIRED below turns a missing database
    # into a failure here instead of a quiet skip.
    #
    # pgvector/pgvector:pg16, NOT plain postgres:16: it IS postgres 16 plus the `vector`
    # extension, so the advisory-lock tests are unaffected while a real vector store can be
    # built (CREATE EXTENSION vector). Plain postgres:16 failed the query-path test with
    # 'extension "vector" is not available'.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test_requirements.txt

      # Cache the NLTK data across runs so a green does not depend on nltk.org being up every
      # time. The key is the RESOURCE NAMES this job fetches, not a lockfile: the names are what
      # unstructured==0.18.32 requests (averaged_perceptron_tagger_eng + punkt_tab -- nltk 3.9.x
      # renamed the tagger; the OLD `averaged_perceptron_tagger` does NOT satisfy the check), so
      # the cache invalidates only when those names change. On a cache HIT the prefetch step is a
      # no-op and the job is fully offline for NLTK. On a cold miss the prefetch step -- a named,
      # retryable step -- is the ONLY place that touches nltk.org; the test phase never does.
      - name: Cache NLTK data
        uses: actions/cache@v4
        with:
          path: ${{ env.NLTK_DATA }}
          key: ${{ runner.os }}-nltk-punkt_tab-averaged_perceptron_tagger_eng-v1

      # Fetch the EXACT resources unstructured==0.18.32 needs for markdown/text partitioning,
      # by the names its source requests (unstructured/nlp/tokenize.py:download_nltk_packages).
      # Programmatic download_dir= is used rather than the `python -m nltk.downloader -d <dir>`
      # CLI, because requirements.txt pins nltk==3.9.1 specifically to avoid the CVE-2026-33236
      # patch that regressed that CLI flag. Idempotent: nltk.download is a no-op when the
      # resource is already present (e.g. restored from cache).
      - name: Prefetch NLTK data (no runtime download during tests)
        run: |
          python - <<'PY'
          import os, nltk
          d = os.environ["NLTK_DATA"]
          os.makedirs(d, exist_ok=True)
          for pkg in ("punkt_tab", "averaged_perceptron_tagger_eng"):
              ok = nltk.download(pkg, download_dir=d, quiet=True)
              assert ok, f"nltk.download failed for {pkg}"
          # Prove the resources resolve OFFLINE exactly as unstructured checks them, so a
          # broken prefetch fails HERE (named step) instead of silently mid-test.
          nltk.find("tokenizers/punkt_tab")
          nltk.find("taggers/averaged_perceptron_tagger_eng")
          print("NLTK data present at", d, ":", sorted(os.listdir(d)))
          PY

      - name: Run tests and generate report
        env:
          # Pin the embeddings provider to Bedrock (Amazon Titan), the provider
          # production runs. The Bedrock client is built offline from dummy AWS
          # creds, so tests need no network and no real credentials. JWT_SECRET
          # is supplied so the identity middleware has a verification key. These
          # values are valid whether the tree treats them as optional (current
          # main: openai default, fail-open) or required (fail-closed identity
          # + approved-provider work landing separately); no OPENAI_API_KEY is
          # needed once the provider is Bedrock.
          JWT_SECRET: test_key
          EMBEDDINGS_PROVIDER: bedrock
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          RAG_TEST_PG_DSN: postgresql://postgres:ci@localhost:5432/postgres
          RAG_TEST_PG_REQUIRED: "1"
          # Disable unstructured's runtime nltk.org download during the test phase. With the
          # resources prefetched above, the markdown/text path resolves them locally; if they
          # were somehow missing, the test now FAILS LOUDLY with a LookupError instead of
          # silently reaching for nltk.org and turning an outage into a flaky red.
          AUTO_DOWNLOAD_NLTK: "false"
        run: |
          pytest --maxfail=1 --disable-warnings --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ===========================================================================
  # FILES-01 F1 -- test the environment the production image actually ships.
  #
  # The job above proves things about Python 3.12. Nothing deployed runs 3.12:
  # `Dockerfile` is `FROM python:3.10` and `Dockerfile.lite` is
  # `FROM python:3.10-slim` (measured in the built image: 3.10.21). So every
  # statement CI made about exception hierarchies, standard-library behaviour and
  # dependency resolution was a statement about a runtime nobody deploys.
  #
  # That is not theoretical. KI-02 hit a real disagreement: a test asserting
  # `asyncio.TimeoutError is not concurrent.futures.TimeoutError` is TRUE on 3.10
  # and FALSE from 3.11, so it passed on the production-equivalent image and failed
  # in CI. And the failure this whole lane exists for -- Excel never ingesting --
  # was a dependency present in one environment and absent in another. This is the
  # same shape one layer up: a `requirements` change can resolve cleanly on 3.12
  # and differently on 3.10, and CI would be green.
  #
  # `Dockerfile.lite` is FIRST and is the one that matters most: `deploy/push.sh`
  # builds *it* for ECR/ECS, so it is the runtime serving production. `Dockerfile`
  # is also a shipped artifact (`images.yaml` publishes it to ghcr on every push to
  # main), so both are gated.
  #
  # This job deliberately does NOT push an image, tag a release or roll a service.
  # It builds, tests, and throws the image away.
  # ===========================================================================
  shipped-runtime:
    name: Shipped runtime (${{ matrix.file }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `label` is only an artifact/job label now -- it is NOT a build target. See the
          # build step: no `target:` is passed, so each Dockerfile builds its final stage,
          # exactly as `deploy/push.sh` does.
          - file: Dockerfile.lite
            label: lite
          - file: Dockerfile
            label: main

    steps:
      # The full image is multi-gigabyte. `images.yaml` already needs this on the
      # same runners, so it is the repo's established pattern rather than a new one.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built from the SAME Dockerfile and the SAME requirements file the published
      # image uses, so `pip` resolves here as it resolves for production.
      # `push: false` -- this gate never publishes anything.
      #
      # DELIBERATELY UNCACHED. The first version of this job carried
      # `cache-from/cache-to: type=gha`, and an independent review showed that defeated the job's
      # own premise. A `RUN pip install -r requirements.lite.txt` layer is keyed on the parent
      # digest and the requirements file BYTES -- not on what pip actually resolves. On a cache
      # hit pip never re-runs, so the gate tests a FROZEN dependency closure, while
      # `deploy/push.sh` has no cache and re-resolves on every operator deploy. With
      # `tenacity>=9.0.0` unbounded and the transitive set floating, the divergence is
      # realizable: a PR touching only app code hits the cached layer and goes green on the old
      # closure while a deploy resolves a newer, broken one. This job exists BECAUSE dependency
      # resolution can differ between environments; caching the resolution away would have made
      # it assert the opposite of what it checks.
      #
      # The cost is nil in practice: the measured 5m27s (lite) and 15m53s (main) were COLD-cache
      # runs, and a ~12.7GB image would thrash GitHub's ~10GB cache budget anyway -- the cache
      # was buying unreliability, not speed.
      #
      # No `target:` either, for the same parity reason: `deploy/push.sh:22` builds
      # `Dockerfile.lite` with NO `--target`, i.e. whatever the final stage is. Pinning a stage
      # name happens to coincide today (each Dockerfile has exactly one), but if a stage were
      # ever appended, production would ship the new final stage while this gate kept testing the
      # old named one -- passing while the parity it promises was silently broken.
      - name: Build the shipped image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: rag-api-shipped:ci

      # Record what was actually tested, so a later reader does not have to trust
      # this comment. If the base image moves, this line moves with it.
      - name: Record the runtime under test
        run: |
          docker run --rm rag-api-shipped:ci python -c "import sys; print('python', sys.version)"
          docker run --rm rag-api-shipped:ci python -c "import platform; print('platform', platform.platform())"

      # Test dependencies only -- the application dependencies are already in the
      # image, installed the way the image installs them. A layer on top is the closest
      # practical thing to running against what ships. NOT "byte-identical", which an earlier
      # version of this comment claimed and review corrected: pip may upgrade a shared
      # dependency if a test requirement demands a newer one (`httpx==0.28.1` here is pinned
      # over whatever the app resolved). The set is small and app-independent, but the suite
      # runs against the shipped closure PLUS these perturbations, and saying otherwise
      # overstates the guarantee.
      #
      # `psycopg[binary]` is a TEST-HARNESS dependency, not an application one, and
      # is deliberately not added to any requirements file. `pytest-postgresql`
      # imports psycopg at collection time; psycopg needs libpq, and `python:3.10-slim`
      # (the base of the image that actually serves production) does not carry it, so
      # collection aborts before a single test runs. The binary wheel brings its own
      # libpq into this throwaway layer. The application does not use psycopg -- it
      # uses asyncpg and psycopg2-binary -- so the shipped image is unchanged and no
      # production dependency is being smuggled in to make a test pass.
      - name: Add test dependencies on top of the shipped image
        run: |
          docker build -t rag-api-shipped-test:ci - <<'DOCKERFILE'
          FROM rag-api-shipped:ci
          RUN pip install --no-cache-dir -r test_requirements.txt "psycopg[binary]"
          DOCKERFILE

      # OFFLINE markdown ingestion -- the invariant this whole card exists for. `.md` ->
      # UnstructuredMarkdownLoader -> unstructured.nlp.tokenize, which at runtime loads the NLTK
      # POS tagger. `--network none` PROVES the shipped image carries the tagger it needs and does
      # NOT reach nltk.org when a user ingests markdown in production. This is red-first by
      # construction: it FAILS with LookupError('averaged_perceptron_tagger_eng') on the pre-fix
      # image (which baked the OLD `averaged_perceptron_tagger` -- MEASURED inert, F-CI-NLTK control A)
      # and PASSES once the Dockerfiles bake `averaged_perceptron_tagger_eng`. If the bake name ever
      # regresses again, this reddens instead of silently depending on a third-party server.
      - name: Prove markdown ingestion works OFFLINE (no nltk.org at runtime)
        env:
          JWT_SECRET: test_key
          EMBEDDINGS_PROVIDER: bedrock
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run --rm --network none \
            -e JWT_SECRET -e EMBEDDINGS_PROVIDER \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            rag-api-shipped-test:ci \
            python -m pytest tests/utils/test_extraction_status.py::test_embed_markdown_reports_complete \
                             -p no:cacheprovider --disable-warnings -q

      # A requirements grep or an import check is NOT proof of extraction. This runs
      # real synthetic workbooks through the real loader inside the shipped image:
      # multi-sheet extraction with per-sheet citations, cached vs uncached formulas,
      # and the refusals -- password-protected, damaged container, empty workbook,
      # and unsupported formats that must be named rather than read as prose.
      # These suites are unconditional by construction: they fail loudly if
      # msoffcrypto is ever dropped again, instead of skipping themselves the way the
      # pre-SP-01.5 tests did when the dependency that broke production went missing.
      - name: Prove real extraction and refusal in the shipped image
        env:
          JWT_SECRET: test_key
          EMBEDDINGS_PROVIDER: bedrock
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run --rm \
            -e JWT_SECRET -e EMBEDDINGS_PROVIDER \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            rag-api-shipped-test:ci \
            python -m pytest tests/utils/test_xlsx_capability.py \
                             tests/utils/test_unsupported_formats.py \
                             tests/utils/test_parser_fitness.py \
                             -p no:cacheprovider --disable-warnings -q

      # User-visible exception BEHAVIOUR on the shipped runtime -- the status code and
      # the sentence a caller receives -- not the identity of an exception class,
      # which is exactly the version-specific detail that made a test straddle 3.10
      # and 3.12. Retryable infrastructure failures must stay distinct from permanent
      # content failures on the runtime that serves users.
      - name: Run the full suite on the shipped runtime
        env:
          JWT_SECRET: test_key
          EMBEDDINGS_PROVIDER: bedrock
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: |
          mkdir -p artifacts
          docker run --rm \
            -e JWT_SECRET -e EMBEDDINGS_PROVIDER \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            rag-api-shipped-test:ci \
            python -m pytest --maxfail=1 --disable-warnings \
                             -p no:cacheprovider \
                             --junitxml=/artifacts/test-results-${{ matrix.label }}.xml

      - name: Upload shipped-runtime test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shipped-${{ matrix.label }}
          path: artifacts/test-results-${{ matrix.label }}.xml